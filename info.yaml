# Tiny Tapeout project information
project:
  title:        "Pongsterpiece"      # Project title
  author:       "apollen85, ChonkieMonkie, Rayjay_coding"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A masterpiece of a PONG game"      # One line description of what your project does
  language:     "VHDL"  # other examples include Verilog, SystemVerilog, Amaranth, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pongsterpiece"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # WARNING: VHDL support in Tiny Tapeout is experimental. The template may get changes during
  #          the shuttle and VHDL support may be dropped for future shuttles if we see low usage.
  source_files:
    - "project.vhdl"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Pause(1)/play(0) game (momentary)"
  ui[1]: "Paddle1 (left) down"
  ui[2]: "Paddle1 (left) up"
  ui[3]: "Paddle2 (right) down"
  ui[4]: "Paddle2 (right) up"
  ui[5]: "Low(0)/high(1) ball speed (step size)"
  ui[6]: "Low(0)/high(1) paddle speed (step size)"
  ui[7]: "Unassigned"

  # Outputs
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSync"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
